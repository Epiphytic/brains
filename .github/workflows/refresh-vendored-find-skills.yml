name: Refresh vendored find-skills

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh references/find-skills.md from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read current vendored SHA
        id: current
        run: |
          set -euo pipefail
          sha=$(grep -oE '\*\*Vendor SHA:\*\* `[a-f0-9]{40}`' references/find-skills.md \
            | grep -oE '[a-f0-9]{40}' | head -n1)
          if [[ -z "$sha" ]]; then
            echo "error: could not extract Vendor SHA from references/find-skills.md" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream SHA
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api 'repos/vercel-labs/skills/commits?path=skills/find-skills/SKILL.md&per_page=1' \
            --jq '.[0].sha')
          if [[ -z "$sha" || "$sha" == "null" ]]; then
            echo "error: could not fetch upstream SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compare SHAs
        id: compare
        env:
          CURRENT_SHA: ${{ steps.current.outputs.sha }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_SHA" == "$UPSTREAM_SHA" ]]; then
            echo "vendored find-skills.md already at upstream SHA $UPSTREAM_SHA — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "vendored=$CURRENT_SHA upstream=$UPSTREAM_SHA — refresh needed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream content and rebuild file
        if: steps.compare.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          upstream_url="https://raw.githubusercontent.com/vercel-labs/skills/${UPSTREAM_SHA}/skills/find-skills/SKILL.md"
          upstream_body=$(mktemp)
          curl -fsSL "$upstream_url" -o "$upstream_body"

          out=references/find-skills.md
          {
            echo '# Find-Skills (vendored fallback)'
            echo ''
            echo '> **Vendored documentation maintenance**'
            echo '>'
            echo '> - **Source:** https://raw.githubusercontent.com/vercel-labs/skills/main/skills/find-skills/SKILL.md'
            echo "> - **Vendor SHA:** \`${UPSTREAM_SHA}\`"
            echo "> - **Vendor date:** ${today}"
            echo '> - **Refresh policy:** SHOULD refresh on each BRAINS minor release; nurture MAY file a `bd create` task labelled `brains:nurture:vendored-docs-refresh` if older than 90 days. A weekly GitHub Action (`.github/workflows/refresh-vendored-find-skills.yml`) auto-opens a refresh PR when upstream SHA drifts.'
            echo '> - **Paired with hotskills MCP API surface:** `hotskills.search`, `hotskills.activate`, `hotskills.invoke`, `hotskills.list`, `hotskills.deactivate`, `hotskills.audit` (per hotskills ADR-001). Field names relied on: `gate_status`, `skill_id`, `installs`. If the hotskills tool name `mcp__plugin_hotskills_hotskills__hotskills_search` or any of the above fields is renamed in a hotskills release, BRAINS detection silently falls through to this fallback.'
            echo '>'
            echo '> The body below is the upstream SKILL.md verbatim. Do not hand-edit; refresh by re-running the workflow or by running it locally and committing the result.'
            echo ''
            echo '---'
            echo ''
            cat "$upstream_body"
          } > "$out"

          rm -f "$upstream_body"

      - name: Open pull request
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: chore/refresh-vendored-find-skills
          delete-branch: true
          commit-message: |
            chore(vendored): refresh references/find-skills.md from upstream

            Auto-generated by .github/workflows/refresh-vendored-find-skills.yml.
            Old SHA: ${{ steps.current.outputs.sha }}
            New SHA: ${{ steps.upstream.outputs.sha }}
          title: 'chore(vendored): refresh references/find-skills.md'
          body: |
            Weekly refresh of the vendored `references/find-skills.md` from
            `vercel-labs/skills` upstream.

            - **Old vendor SHA:** `${{ steps.current.outputs.sha }}`
            - **New vendor SHA:** `${{ steps.upstream.outputs.sha }}`
            - **Source:** https://github.com/vercel-labs/skills/blob/main/skills/find-skills/SKILL.md

            Review the diff to confirm the upstream SKILL.md still matches the
            BRAINS detection contract documented in `references/skills-detection.md`
            and `references/skills-invocation.md`. Merge when ready.
          labels: |
            vendored-refresh
            automated
